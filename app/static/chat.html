<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0F766E">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <title>{{business_name}} · Chat</title>
  <meta name="description" content="Ask {{business_name}} about prices, opening hours and services, in your own language.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Jawab">
  <meta property="og:title" content="{{business_name}} · Ask us anything">
  <meta property="og:description" content="Prices, opening hours and services, answered in your own language.">
  <meta name="twitter:card" content="summary">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/static/chat.css">
  <!--{{accent_style}}-->
</head>
<body>
  <main id="layout" class="layout">
    <nav class="brandbar" aria-label="Jawab"><a class="wordmark" href="/"><span>Jawab</span><span class="wordmark-ar" lang="ar">جواب</span></a></nav>
    <section class="chat" aria-label="Chat">
      <header class="chat-header">
        <div class="identity">
          <span class="avatar" aria-hidden="true" id="avatar"></span>
          <div class="identity-text">
            <h1 id="business-name" dir="auto">&nbsp;</h1>
            <p class="subtitle" data-i18n="subtitle" dir="auto"></p>
          </div>
        </div>
        <div class="header-actions">
          <div class="lang-toggle" role="group" aria-label="Language">
            <button type="button" class="lang" data-lang="en" lang="en">EN</button>
            <button type="button" class="lang" data-lang="el" lang="el">ΕΛ</button>
            <button type="button" class="lang" data-lang="ar" lang="ar">عربي</button>
          </div>
          <button type="button" id="new-chat" class="ghost-button" data-i18n="newChat" dir="auto"></button>
        </div>
      </header>

      <ol id="messages" class="messages" aria-live="polite"></ol>

      <div id="suggestions" class="suggestions" data-i18n-aria-label="suggestionsAria"></div>

      <form id="composer" class="composer">
        <input id="input" type="text" maxlength="500" autocomplete="off" dir="auto"
               data-i18n-placeholder="placeholder" data-i18n-aria-label="inputAria">
        <button id="send" type="submit" data-i18n="send" dir="auto"></button>
      </form>

      <footer class="footer" id="footer" dir="auto"></footer>
    </section>

    <!-- "Behind the reply": only with ?panel=1. A column on wide screens, a sheet on phones. -->
    <aside id="panel" class="panel" hidden>
      <div class="panel-header">
        <h2 data-i18n="panelTitle" dir="auto"></h2>
        <button id="panel-close" type="button" class="panel-close" data-i18n-aria-label="close">×</button>
      </div>
      <div id="panel-body" class="panel-body"></div>
    </aside>
  </main>

  <script src="/static/chat.js"></script>
</body>
</html>
